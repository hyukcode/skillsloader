[project]
name = "skill-loader-wy"
version = "0.1.0"
description = "Sync AI agent skills to Claude Code, Codex and Cursor"
requires-python = ">=3.9"
readme = "README.md"

dependencies = [
    "typer>=0.12"
]


[project.scripts]

skill-loader-wy = "skills_loader.cli:app"


[build-system]

requires = [
    "setuptools>=68"
]

build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
